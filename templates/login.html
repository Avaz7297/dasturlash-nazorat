{% extends 'base.html' %}

{% block title %}Mas'ul O'qituvchi Kirishi | Python Dasturlash{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-white border border-slate-200 rounded-3xl p-8 shadow-xl">
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-slate-900 text-white flex items-center justify-center mx-auto mb-3 text-2xl shadow-md">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Mas'ul O'qituvchi Kirishi</h1>
            <p class="text-xs text-slate-500 mt-1">
                Ushbu bo'lim faqat fan o'qituvchisi uchun mo'ljallangan.
            </p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                    Login
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <input type="text" id="username" name="username" required autocomplete="off"
                        class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-300 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all outline-none">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                    Maxfiy Parol
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-key"></i>
                    </div>
                    <input type="password" id="password" name="password" required autocomplete="off"
                        class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-300 rounded-xl text-slate-800 text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all outline-none">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="w-full py-3 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow-md flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Tizimga Kirish</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
